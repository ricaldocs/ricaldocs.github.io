# .github/workflows/ci.yml
# ==========================================
# CI: TEST & VALIDATION
# ==========================================

name: "🔍 CI - Test & Validate"

on:
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cache-version: 1

      - name: 📦 Install Dependencies
        run: |
          bundle install --jobs 4 --retry 3 --without development

      - name: 🔨 Build Test
        run: |
          bundle exec jekyll build --profile --trace
        env:
          JEKYLL_ENV: production

      - name: 🔍 HTML Proofer
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --allow-hash-href \
            --empty-alt-ignore \
            --file-ignore "/assets\/.*/"
        continue-on-error: true

      - name: 📊 Jekyll Doctor
        run: |
          bundle exec jekyll doctor

      - name: 📈 Upload Build Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: |
            _site/
            .jekyll-cache/
          retention-days: 7

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test

    steps:
      - name: ✅ Validate PR Title
        uses: deepakputhraya/action-pr-title@v1
        with:
          regex: '^(feat|fix|docs|style|refactor|perf|test|chore|ci|build)(\(.+\))?: .{1,100}$'
          allowed_prefixes: "feat,fix,docs,style,refactor,perf,test,chore,ci,build"
          prefix_case_sensitive: false
          min_length: 10
          max_length: 100
