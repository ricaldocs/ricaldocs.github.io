# Teks tata letak situs

# ----- Label umum -----

layout:
  post: Postingan
  category: Kategori
  tag: Tag

# Tab di sidebar
tabs:
  # format: <nama_file_tanpa_ekstensi>: <nilai>
  home: Beranda
  categories: Kategori
  tags: Tag
  archives: Arsip
  about: Tentang

# teks yang ditampilkan di bilah pencarian & hasil pencarian
search:
  hint: cari dokumentasi
  cancel: Batal
  no_results: Maaf, tidak ditemukan hasil yang sesuai.

panel:
  lastmod: Pembaruan Terbaru
  trending_tags: Tag Populer
  toc: Daftar Isi

copyright:
  # Ditampilkan di bagian bawah dokumen
  license:
    template: Dokumen ini dilisensikan di bawah :LICENSE_NAME oleh penulis.
    name: CC BY 4.0
    link: https://creativecommons.org/licenses/by/4.0/

  # Ditampilkan di footer
  brief: Sebagian hak cipta dilindungi undang-undang.
  verbose: >-
    Kecuali dinyatakan secara eksplisit, seluruh konten dokumentasi pada situs ini 
    dilisensikan di bawah Lisensi Creative Commons Attribution 4.0 International (CC BY 4.0).

meta: Didukung oleh tema :THEME pada platform :PLATFORM.

not_found:
  statement: Maaf, halaman yang Anda akses tidak tersedia atau URL salah.

notification:
  update_found: Versi baru tersedia
  update: Perbarui

theme:
  light: Mode Terang
  dark: Mode Gelap
  system: Ikuti Sistem

# ----- Label terkait dokumen -----

post:
  written_by: Penulis
  posted: Dipublikasikan
  updated: Diperbarui
  words: kata
  pageview_measure: kali dibaca
  read_time:
    unit: menit
    prompt: waktu baca
  edit: Sunting dokumen ini
  relate_posts: Dokumentasi Terkait
  share: Bagikan
  button:
    next: Dokumen Terbaru
    previous: Dokumen Sebelumnya
    copy_code:
      succeed: Kode berhasil disalin!
    share_link:
      title: Salin tautan
      succeed: Tautan berhasil disalin!

# Format tanggal dan waktu.
# Referensi: <http://strftime.net/>, <https://day.js.org/docs/en/display/format>
df:
  post:
    strftime: "%b %e, %Y"
    dayjs: "ll"
  archives:
    strftime: "%b"
    dayjs: "MMM"

# halaman kategori
categories:
  category_measure:
    singular: kategori
    plural: kategori
  post_measure:
    singular: dokumen
    plural: dokumen
