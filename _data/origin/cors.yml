# Resource Hints
resource_hints:
  - url: /assets
    links:
      - rel: preconnect
      - rel: dns-prefetch
  - url: /assets/fonts
    links:
      - rel: preconnect
        opts: [crossorigin]
      - rel: dns-prefetch
  - url: /assets/webfonts
    links:
      - rel: preconnect
        opts: [crossorigin]
      - rel: dns-prefetch

# Web Fonts
webfonts: /assets/css/fonts.css

# Libraries

toc:
  css: /assets/css/tocbot.min.css
  js: /assets/js/tocbot.min.js

fontawesome:
  css: /assets/css/fontawesome-all.min.css

search:
  js: /assets/js/simple-jekyll-search.min.js

mermaid:
  js: /assets/js/mermaid.min.js

dayjs:
  js:
    common: /assets/js/dayjs.min.js
    locale: /assets/js/locale/:LOCALE.js
    relativeTime: /assets/js/plugin/relativeTime.js
    localizedFormat: /assets/js/plugin/localizedFormat.js

glightbox:
  css: /assets/css/glightbox.min.css
  js: /assets/js/glightbox.min.js

lazy-polyfill:
  css: /assets/css/loading-attribute-polyfill.min.css
  js: /assets/js/loading-attribute-polyfill.umd.min.js

clipboard:
  js: /assets/js/clipboard.min.js

mathjax:
  js: /assets/js/tex-chtml.js

firacode:
  css: /assets/css/fira_code.css

socket-io-client:
  js: /assets/js/socket.io.min.js

waline:
  js: /assets/js/waline.js
  css: /assets/css/waline.css
  emojis: /assets/emojis

# Kustomisasi Tautan Ikon Iconfont. › https://www.iconfont.cn/
# Jika perlu menambahkan ikon Iconfont sendiri, silakan buat proyek baru di Iconfont,
# tambahkan ikon ke proyek, pilih Font Class, lihat tautan online, dan salin ke bawah.
# Perhatian: Jangan sampai nama ikon bentrok dengan ikon yang sudah digunakan di proyek, silakan cari secara global untuk memastikan nama tersebut tidak digunakan.
# Cara yang baik adalah mengubah prefiks FontClass/Symbol proyek Iconfont menjadi nilai lain.
iconfont:
  css:
    # CSS ini berisi ikon dengan prefiks 'icon-', yang merupakan ikon inti dari template, jangan dihapus.
    - /assets/css/iconfont-core.css
    # Tambahkan tautan ikon Iconfont Anda
    # -
